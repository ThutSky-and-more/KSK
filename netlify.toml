[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Admin-Bereich: nur Identity-Rolle admin
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/login/?next=/admin/"
  status = 401
  force = true

# Schüler-CMS: student und admin
[[redirects]]
  from = "/schreiben/*"
  to = "/schreiben/:splat"
  status = 200
  force = true
  conditions = { Role = ["student", "admin"] }

[[redirects]]
  from = "/schreiben/*"
  to = "/login/?next=/schreiben/"
  status = 401
  force = true

# Schülerbereich: student und admin
[[redirects]]
  from = "/schueler/*"
  to = "/schueler/:splat"
  status = 200
  force = true
  conditions = { Role = ["student", "admin"] }

[[redirects]]
  from = "/schueler/*"
  to = "/login/?next=/schueler/"
  status = 401
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
