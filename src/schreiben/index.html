<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>Öppis iiträge · Kanti Ziitkapsle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="/schreiben/config.yml" type="text/yaml" rel="cms-config-url">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root{--cmsbar:52px}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#07101f;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
    body{min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-rows:auto minmax(0,1fr)}
    .cms-help{position:relative;z-index:20;min-height:var(--cmsbar);display:flex;gap:14px;align-items:center;justify-content:space-between;padding:9px max(14px,env(safe-area-inset-right)) 9px max(14px,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(16,33,63,.98),rgba(36,24,58,.98));border-bottom:1px solid #ffffff20;box-shadow:0 8px 28px #0005;font-size:14px}
    .cms-help a{color:#fff;text-decoration:none;font-weight:800;white-space:nowrap;padding:7px 10px;border-radius:10px;background:#ffffff0d;border:1px solid #ffffff14}
    .cms-help span{color:#cbd7f0;line-height:1.35;text-align:right}
    #nc-root{min-width:0;min-height:0;height:100%!important;max-height:100%!important;overflow:auto!important;overscroll-behavior:contain;background:#07101f}
    #nc-root>div{height:100%!important;min-height:0!important;max-height:100%!important;overflow:auto!important}
    @media(max-width:700px){:root{--cmsbar:60px}.cms-help{gap:8px;padding-top:7px;padding-bottom:7px}.cms-help span{font-size:11px;line-height:1.25}.cms-help a{font-size:13px;padding:7px 9px}}
    @media(max-width:470px){.cms-help span{display:none}}
  </style>
</head>
<body>
  <div class="cms-help"><a href="/index.html">← Home</a><span>Nach em Speichere startet Netlify automatisch en neue Deploy. De Iitrag erscheint normalerwiis nach ca. 10–60 Sekunde uf de Site.</span></div>
  <div id="nc-root"></div>
  <noscript>Für s CMS mues JavaScript aktiviert sii.</noscript>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
</body>
</html>
