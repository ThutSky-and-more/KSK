- name: iistellige
  label: ⚙ Site-Iistellige
  files:
  - name: site
    label: Allgemein & Countdown
    file: content/settings/site.json
    extension: json
    format: json
    fields:
    - label: Site-Name
      name: site_name
      widget: string
    - label: Klasse
      name: class_name
      widget: string
    - label: Hero-Zeile oben
      name: hero_kicker
      widget: string
    - label: Hero-Titel Zeile 1
      name: hero_title_1
      widget: string
    - label: Hero-Titel Zeile 2
      name: hero_title_2
      widget: string
    - label: Hero-Text
      name: hero_text
      widget: text
    - label: Zitat
      name: quote
      widget: text
    - label: Schuelstart
      name: school_start_date
      widget: datetime
      time_format: false
      format: YYYY-MM-DD
      default: '2026-08-10'
    - label: Letzte Schueltag / Schuelschluss
      name: graduation_date
      widget: datetime
      date_format: DD.MM.YYYY
      time_format: HH:mm
      format: YYYY-MM-DDTHH:mm:ssZ
      required: false
      hint: Das Datum im Juli legsch du als Admin fest. Solang s leer isch, zeigt d Site no kei Countdown.
    - label: Schuelfreii Täg für de Countdown
      name: school_free_days
      widget: list
      required: false
      field:
        label: Datum
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
