backend:
  name: git-gateway
  branch: main

local_backend: true
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: editorial_workflow

collections:
  - name: "memories"
    label: "Erinnerige"
    label_singular: "Erinnerig"
    folder: "content/memories"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} · {{category}} · {{title}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Datum", name: "date", widget: "datetime", time_format: false, format: "YYYY-MM-DD"}
      - {label: "Kategorie", name: "category", widget: "select", options: ["Erinnerig", "Lehrer-Spruch", "Meme", "Foto", "Kanti Lore", "Ausflug", "Prüefigs-Lore", "Random"]}
      - {label: "Von wem?", name: "author", widget: "string", default: "Anonym", required: false}
      - {label: "Spruch / Kurztext", name: "quote", widget: "text", required: false}
      - {label: "Story", name: "body", widget: "text"}
      - {label: "Bild / Meme", name: "image", widget: "image", required: false}
      - {label: "Für Highlights markieren", name: "featured", widget: "boolean", default: false}
  - name: "settings"
    label: "Website Einstellungen"
    files:
      - label: "Allgemein"
        name: "site"
        file: "content/settings/site.json"
        format: "json"
        fields:
          - {label: "Seitentitel", name: "siteTitle", widget: "string"}
          - {label: "Klassenname", name: "className", widget: "string"}
          - {label: "Kanti-Start", name: "startDate", widget: "datetime", time_format: false, format: "YYYY-MM-DD"}
          - {label: "Letzter Schultag / Matura", name: "graduationDate", widget: "datetime", time_format: false, format: "YYYY-MM-DD"}
          - {label: "Startseiten-Spruch", name: "heroLine", widget: "string"}
          - {label: "Footer-Spruch", name: "footerLine", widget: "string"}
