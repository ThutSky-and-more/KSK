backend:
  name: git-gateway
  branch: main

locale: de
media_folder: "src/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "meini_beitraeg"
    label: "Mini/offeni Beiträg"
    label_singular: "Beitrag"
    description: "Da chasch en neue Beitrag erfasse. Freigegebni Beiträg verschwinde us dere Ansicht."
    folder: "content/posts"
    create: true
    delete: false
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter: { field: "status", value: "pending" }
    summary: "{{title}} · {{author}} · {{category}}"
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string", hint: "Churz und so, dass mer grad weiss, um was es gaht." }
      - { label: "Datum / Ziit vom Momänt", name: "date", widget: "datetime", date_format: "DD.MM.YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Erinnerig", value: "erinnerig" }
          - { label: "Lehrer-Spruch", value: "lehrer-spruch" }
          - { label: "Meme", value: "meme" }
          - { label: "Foto", value: "foto" }
          - { label: "Kanti-Lore", value: "kanti-lore" }
      - { label: "Vo wem?", name: "author", widget: "string", default: "Anonym", hint: "Din Name, Spitzname oder Anonym." }
      - { label: "Kurzi Vorschau", name: "excerpt", widget: "text", hint: "1–2 Sätz für d Karte uf de Startsite." }
      - { label: "Bericht / Gschicht", name: "body", widget: "markdown", hint: "Schriib ruhig uf Schwiizerdütsch. Überschrifte, fett, Liste usw. gönd au." }
      - { label: "Bild / Meme", name: "image", widget: "image", required: false, hint: "JPG, PNG, WebP usw. – wird direkt mit em Beitrag gspeicheret." }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Status", name: "status", widget: "hidden", default: "pending" }
      - { label: "Uf Startsite hervorhebe", name: "featured", widget: "hidden", default: false }
      - { label: "Für Flashback", name: "flashback", widget: "hidden", default: false }
