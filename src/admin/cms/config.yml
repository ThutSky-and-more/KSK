backend:
  name: git-gateway
  branch: main
locale: de
media_folder: src/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: erinnerungen
  label: 🫧 Erinnerige
  label_singular: Erinnerig
  folder: content/erinnerungen
  create: true
  delete: true
  extension: json
  format: json
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  summary: '{{title}} · {{status}} · {{author}}'
  editor:
    preview: false
  fields:
  - label: Titel
    name: title
    widget: string
  - label: Datum / Ziit
    name: date
    widget: datetime
    date_format: DD.MM.YYYY
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ssZ
  - label: Autor:in
    name: author
    widget: string
  - label: Kurzi Vorschau
    name: excerpt
    widget: text
  - label: D Gschicht
    name: body
    widget: markdown
  - label: Bild
    name: image
    widget: image
    required: false
  - label: Tags
    name: tags
    widget: list
    required: false
    default: []
  - label: Status
    name: status
    widget: select
    default: pending
    options:
    - label: ⏳ Wartet
      value: pending
    - label: ✓ Freigegeh
      value: approved
    - label: ✕ Abglehnt
      value: rejected
  - label: Uf Startsite hervorhebe
    name: featured
    widget: boolean
    default: false
    required: false
  - label: Für Flashback bevorzuge
    name: flashback
    widget: boolean
    default: false
    required: false
