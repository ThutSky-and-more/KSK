backend:
  name: git-gateway
  branch: main
locale: de
media_folder: src/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: erinnerungen
  label: 🫧 Erinnerige
  label_singular: Erinnerig
  folder: content/erinnerungen
  create: true
  delete: false
  extension: json
  format: json
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  filter:
    field: status
    value: pending
  summary: '{{title}} · {{author}}'
  editor:
    preview: false
  fields:
  - label: Titel
    name: title
    widget: string
  - label: Datum / Ziit
    name: date
    widget: datetime
    date_format: DD.MM.YYYY
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ssZ
  - label: Vo wem?
    name: author
    widget: string
    default: Anonym
    hint: Din Name, Spitzname oder Anonym.
  - label: Kurzi Vorschau
    name: excerpt
    widget: text
  - label: D Gschicht
    name: body
    widget: markdown
    hint: Schriib gern uf Schwiizerdütsch.
  - label: Bild
    name: image
    widget: image
    required: false
  - label: Tags
    name: tags
    widget: list
    required: false
    default: []
  - label: Status
    name: status
    widget: hidden
    default: pending
  - label: Featured
    name: featured
    widget: hidden
    default: false
  - label: Flashback
    name: flashback
    widget: hidden
    default: false
