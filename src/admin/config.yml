backend:
  name: git-gateway
  branch: main

locale: de
media_folder: "src/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "beitraeg"
    label: "Alli Beiträg"
    label_singular: "Beitrag"
    description: "Pending prüefe, freigeh oder ablehne. Nur approved wird uf de öffentliche Site aazeigt."
    folder: "content/posts"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{status}} · {{author}}"
    editor:
      preview: false
    view_filters:
      - { label: "Nur pending", field: "status", pattern: "pending" }
      - { label: "Nur freigegeh", field: "status", pattern: "approved" }
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum / Ziit", name: "date", widget: "datetime", date_format: "DD.MM.YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Erinnerig", value: "erinnerig" }
          - { label: "Lehrer-Spruch", value: "lehrer-spruch" }
          - { label: "Meme", value: "meme" }
          - { label: "Foto", value: "foto" }
          - { label: "Kanti-Lore", value: "kanti-lore" }
      - { label: "Autor:in", name: "author", widget: "string" }
      - { label: "Kurzi Vorschau", name: "excerpt", widget: "text" }
      - { label: "Bericht / Gschicht", name: "body", widget: "markdown" }
      - { label: "Bild / Meme", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - label: "Status"
        name: "status"
        widget: "select"
        default: "pending"
        options:
          - { label: "⏳ Wartet uf Freigab", value: "pending" }
          - { label: "✓ Freigegeh", value: "approved" }
          - { label: "✕ Abglehnt", value: "rejected" }
      - { label: "Uf Startsite hervorhebe", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Für Freitigs-Flashback bevorzuge", name: "flashback", widget: "boolean", default: false, required: false }

  - name: "iistellige"
    label: "Site-Iistellige"
    files:
      - name: "site"
        label: "Allgemein"
        file: "content/settings/site.json"
        extension: "json"
        format: "json"
        fields:
          - { label: "Site-Name", name: "site_name", widget: "string" }
          - { label: "Klasse", name: "class_name", widget: "string" }
          - { label: "Hero-Zeile oben", name: "hero_kicker", widget: "string" }
          - { label: "Hero-Titel Zeile 1", name: "hero_title_1", widget: "string" }
          - { label: "Hero-Titel Zeile 2", name: "hero_title_2", widget: "string" }
          - { label: "Hero-Text", name: "hero_text", widget: "text" }
          - { label: "Zitat", name: "quote", widget: "text" }
          - { label: "Matura / letzter Schultag", name: "graduation_date", widget: "datetime", date_format: "DD.MM.YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
          - { label: "Schuelstart", name: "school_start_date", widget: "datetime", time_format: false, format: "YYYY-MM-DD" }
          - label: "Schuelfreii Täg für Countdown"
            name: "school_free_days"
            widget: "list"
            required: false
            field: { label: "Datum", name: "date", widget: "datetime", time_format: false, format: "YYYY-MM-DD" }
