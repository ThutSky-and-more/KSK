[build]
  command = "npm run build"
  publish = "dist"

# Admin wird NICHT über einen separaten Admin-Login bestimmt.
# Netlify liest die Identity-Rolle aus app_metadata.roles.
# Nur Benutzer mit der Rolle "admin" erhalten /admin/*.
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/admin/*"
  to = "/login/"
  status = 401
  force = true

# Jeder eingeloggte Klassenaccount mit student oder admin darf in den Schülerbereich.
[[redirects]]
  from = "/schueler/*"
  to = "/schueler/:splat"
  status = 200
  force = true
  conditions = {Role = ["student", "admin"]}

[[redirects]]
  from = "/schueler/*"
  to = "/login/"
  status = 401
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
